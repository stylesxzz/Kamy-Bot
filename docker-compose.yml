services:
  kamy-bot:
    build: .
    container_name: kamy-bot
    init: true
    restart: unless-stopped
    ports:
      - "${KAMY_BIND:-127.0.0.1}:${KAMY_PORT:-8000}:8000"
    environment:
      KAMY_DATA_DIR: /data
      KAMY_BROWSER_ENABLED: "${KAMY_BROWSER_ENABLED:-1}"
      KAMY_MASTER_KEY: "${KAMY_MASTER_KEY:-}"
      KAMY_ADMIN_USERNAME: "${KAMY_ADMIN_USERNAME:-admin}"
      KAMY_ADMIN_PASSWORD: "${KAMY_ADMIN_PASSWORD:-}"
      KAMY_SESSION_SECRET: "${KAMY_SESSION_SECRET:-}"
      KAMY_COOKIE_SECURE: "${KAMY_COOKIE_SECURE:-1}"
      KAMY_MCP_ALLOWED_HOSTS: "${KAMY_MCP_ALLOWED_HOSTS:-}"
    volumes:
      - kamy_data:/data
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  kamy_data:
