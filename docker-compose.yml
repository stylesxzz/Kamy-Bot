services:
  kamy-bot:
    build: .
    container_name: kamy-bot
    init: true
    restart: unless-stopped
    ports:
      - "${KAMY_PORT:-8000}:8000"
    environment:
      KAMY_DATA_DIR: /data
    volumes:
      - kamy_data:/data
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  kamy_data:
