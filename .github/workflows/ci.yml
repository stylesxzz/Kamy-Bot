name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=pydantic-core -r requirements.txt pytest
      - name: Python syntax check
        run: python -m compileall -q app.py extensions.py security.py tests
      - name: Run tests
        run: pytest -q
      - name: Check frontend JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/extensions.js
          node --check static/settings.js
          node --check bin/kamy-bot.js
          node -e 'const p=require("./package.json"); if (p.name!=="kamy-bot" || !p.bin || !p.bin["kamy-bot"]) process.exit(1);'
          npm pack --dry-run
      - name: Test native CLI bootstrap (.venv + requirements.txt)
        env:
          KAMY_HOME: ${{ runner.temp }}/kamy-cli-bootstrap
        run: |
          node bin/kamy-bot.js --setup-only
          "$KAMY_HOME/app/.venv/bin/python" -c 'import sys,fastapi,uvicorn,httpx,pydantic,cryptography,jsonschema,mcp; assert sys.prefix != sys.base_prefix'
          test -s "$KAMY_HOME/app/.venv/.kamy-requirements-sha256"
      - name: Validate Docker Compose configuration
        run: docker compose config -q
