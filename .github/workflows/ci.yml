name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Python syntax check
        run: python -m compileall -q app.py extensions.py security.py tests
      - name: Run tests
        run: pytest -q
      - name: Check frontend JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/extensions.js
          node --check static/settings.js
          node --check bin/kamy-bot.js
          node -e 'const p=require("./package.json"); if (p.name!=="kamy-bot" || !p.bin || !p.bin["kamy-bot"]) process.exit(1);'
          npm pack --dry-run
      - name: Validate Docker Compose configuration
        run: docker compose config -q
